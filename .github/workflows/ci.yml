name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Build and test the npm package
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          bash scripts/build-wasm.sh
          cd npm && node test.mjs
      - name: Build and test the VS Code extension
        run: |
          bash scripts/build-vscode.sh
          cd vscode && node test.js
      - name: Build the web app
        run: bash scripts/build-web.sh
      - name: Review demo upgrade (fails on High/Critical, which is expected for the fixture)
        run: |
          set +e
          cargo run -q -p tidemark-cli -- diff fixtures/demo_vault_v1.so fixtures/demo_vault_v2.so
          test $? -eq 2

  watcher-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tidemark-watcher .
      - name: Entrypoint refuses to start without programs
        run: |
          set +e
          docker run --rm tidemark-watcher
          test $? -ne 0

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked kani-verifier --version 0.68.0
      - name: Kani setup, retried because its bundle download can time out
        run: |
          for i in 1 2 3 4 5; do
            cargo kani setup && break
            echo "kani setup failed (attempt $i), retrying"
            sleep 30
          done
          cargo kani --version
      - run: cargo kani -p tidemark-core
