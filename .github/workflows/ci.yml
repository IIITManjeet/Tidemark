name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Build and test the npm package
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          bash scripts/build-wasm.sh
          cd npm && node test.mjs
      - name: Review demo upgrade (fails on High/Critical, which is expected for the fixture)
        run: |
          set +e
          cargo run -q -p tidemark-cli -- diff fixtures/demo_vault_v1.so fixtures/demo_vault_v2.so
          test $? -eq 2

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          args: -p tidemark-core
