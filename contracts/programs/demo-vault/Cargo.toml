[package]
name = "demo-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Demo fixture: a tiny SOL vault. The v2 feature builds a deliberately backdoored upgrade for Tidemark to catch. Devnet only."

[lib]
crate-type = ["cdylib", "lib"]
name = "demo_vault"

[features]
default = []
v2 = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
