[package]
name = "tidemark-ledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Hash-linked, public attestations of Solana program upgrade reviews"

[lib]
crate-type = ["cdylib", "lib"]
name = "tidemark_ledger"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
